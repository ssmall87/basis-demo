<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Basis Demo</title>
<meta name="robots" content="noindex">
<meta name="description" content="Basis, a 1031 business platform: a demo with made-up records.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Crect width=%2232%22 height=%2232%22 rx=%227%22 fill=%22%231F5FAE%22/%3E%3Cpath d=%22M8 23V9M13 23V13M18 23V11M23 23V15%22 stroke=%22white%22 stroke-width=%223%22 stroke-linecap=%22round%22/%3E%3C/svg%3E">
<link href="https://fonts.googleapis.com/css2?family=Libre+Franklin:wght@300..900&display=swap" rel="stylesheet">
<style>
/* ===== tokens: brand palette (brick red #9F2D20, charcoal, warm grays, Libre Franklin) ===== */
:root{
  color-scheme:light;
  --canvas:#F3F3F3; --surface:#FFFFFF; --surface-2:#F7F7F7; --surface-3:#ECECEC;
  --ink:#212121; --ink-2:#4B4B4B; --ink-3:#6C757D; --line:#DCDCDC; --line-2:#EAEAEA;
  --bar:#FFFFFF; --bar-ink:#212121; --bar-ink-2:#6C757D; --bar-line:#E0E0E0; --bar-field:#F0F0F0;
  --nav:#333333; --nav-2:#4A4A4A; --nav-ink:#F2F2F2; --nav-ink-2:#B8B8B8; --brass-nav:#9F2D20;
  --action:#9F2D20; --action-hover:#7A2318; --action-ink:#FFFFFF; --action-soft:#F8E6E3;
  --brass:#9F2D20; --brass-soft:#F8E6E3; --brass-line:#E3B4AC;
  --ok:#1E7B4F; --ok-soft:#DDF1E8; --warn:#A85A00; --warn-soft:#FBEACB; --danger:#D32F2F; --danger-soft:#FADDDD;
  --s-lead:#9AA0A6; --s-qualified:#7B8288; --s-docs:#605B5B; --s-funded:#9F2D20; --s-identified:#7A2318; --s-completed:#212121; --s-lost:#C4A9A5; --wk-below:#7B8288;
  --shadow-overlay:0 18px 48px rgba(20,20,20,.28);
  --font:"Libre Franklin","Helvetica Neue",Helvetica,Arial,system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --canvas:#121212; --surface:#1C1C1C; --surface-2:#232323; --surface-3:#2C2C2C;
    --ink:#EDEDED; --ink-2:#C4C4C4; --ink-3:#9A9A9A; --line:#353535; --line-2:#2A2A2A;
    --bar:#181818; --bar-ink:#F2F2F2; --bar-ink-2:#A8A8A8; --bar-line:#333333; --bar-field:#2A2A2A;
    --nav:#2A2A2A; --nav-2:#3A3A3A; --nav-ink:#F2F2F2; --nav-ink-2:#B0B0B0; --brass-nav:#E0604F;
    --action:#E0604F; --action-hover:#EB7A6B; --action-ink:#1A0A08; --action-soft:#3A1F1B;
    --brass:#E0604F; --brass-soft:#3A1F1B; --brass-line:#6B3A34;
    --ok:#54C79B; --ok-soft:#12352A; --warn:#EBAE4E; --warn-soft:#3B2C10; --danger:#F47E7E; --danger-soft:#451B1B;
    --s-lead:#8A8A8A; --s-qualified:#A3A3A3; --s-docs:#C4C4C4; --s-funded:#E0604F; --s-identified:#EB8A7C; --s-completed:#EDEDED; --s-lost:#8C5A55; --wk-below:#8A8A8A;
    --shadow-overlay:0 18px 48px rgba(0,0,0,.6);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --canvas:#121212; --surface:#1C1C1C; --surface-2:#232323; --surface-3:#2C2C2C;
  --ink:#EDEDED; --ink-2:#C4C4C4; --ink-3:#9A9A9A; --line:#353535; --line-2:#2A2A2A;
  --bar:#181818; --bar-ink:#F2F2F2; --bar-ink-2:#A8A8A8; --bar-line:#333333; --bar-field:#2A2A2A;
  --nav:#2A2A2A; --nav-2:#3A3A3A; --nav-ink:#F2F2F2; --nav-ink-2:#B0B0B0; --brass-nav:#E0604F;
  --action:#E0604F; --action-hover:#EB7A6B; --action-ink:#1A0A08; --action-soft:#3A1F1B;
  --brass:#E0604F; --brass-soft:#3A1F1B; --brass-line:#6B3A34;
  --ok:#54C79B; --ok-soft:#12352A; --warn:#EBAE4E; --warn-soft:#3B2C10; --danger:#F47E7E; --danger-soft:#451B1B;
  --s-lead:#8A8A8A; --s-qualified:#A3A3A3; --s-docs:#C4C4C4; --s-funded:#E0604F; --s-identified:#EB8A7C; --s-completed:#EDEDED; --s-lost:#8C5A55; --wk-below:#8A8A8A;
  --shadow-overlay:0 18px 48px rgba(0,0,0,.6);
}

/* demo profile: the same page in blue (html.demo), so it is never mistaken for the real records */
:root.demo{
  --brass-nav:#1D5FA7; --action:#1D5FA7; --action-hover:#164A84; --action-soft:#E3EDF8;
  --brass:#1D5FA7; --brass-soft:#E3EDF8; --brass-line:#AFC8E6; --s-funded:#1D5FA7; --s-identified:#164A84; --s-lost:#A9B8C7;
}
@media (prefers-color-scheme:dark){
  :root.demo:not([data-theme="light"]){
    --brass-nav:#5B9BE6; --action:#5B9BE6; --action-hover:#7AAFEC; --action-ink:#07121F; --action-soft:#16263A;
    --brass:#5B9BE6; --brass-soft:#16263A; --brass-line:#2F4C6E; --s-funded:#5B9BE6; --s-identified:#86B6EE; --s-lost:#5A6E82;
  }
}
:root.demo[data-theme="dark"]{
  --brass-nav:#5B9BE6; --action:#5B9BE6; --action-hover:#7AAFEC; --action-ink:#07121F; --action-soft:#16263A;
  --brass:#5B9BE6; --brass-soft:#16263A; --brass-line:#2F4C6E; --s-funded:#5B9BE6; --s-identified:#86B6EE; --s-lost:#5A6E82;
}

/* ===== base ===== */
*{box-sizing:border-box}
html{height:100%}
body{margin:0;min-height:100%;background:var(--canvas);color:var(--ink);font:400 15px/1.45 var(--font);-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%;overflow-x:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
h1,h2,h3,p,ul,ol{margin:0;padding:0}
ul,ol{list-style:none}
a{color:var(--action);text-decoration:none}
a:hover{text-decoration:underline}
:focus-visible{outline:2px solid var(--action);outline-offset:2px;border-radius:4px}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--ink-3)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
svg.ic{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
body.readonly .w{display:none !important}

/* ===== top bar ===== */
.topbar{position:sticky;top:calc(env(safe-area-inset-top,0px) + 8px);z-index:30;display:flex;align-items:center;gap:2px;height:52px;margin:8px 8px 0;padding:0 6px 0 12px;background:var(--bar);color:var(--bar-ink);border:1px solid var(--bar-line);border-radius:12px;box-shadow:0 0 0 8px var(--canvas)}
.brand{display:flex;align-items:center;gap:9px;background:none;border:0;color:var(--action);padding:6px 6px 6px 2px;margin-right:auto;font-weight:760;font-stretch:112%;font-size:18px;letter-spacing:.005em}
.brand svg{width:26px;height:26px}
.topnav{display:none;align-self:stretch;margin:0 auto 0 14px}
.topnav button{background:none;border:0;border-top:3px solid transparent;border-bottom:3px solid transparent;color:var(--bar-ink-2);padding:0 13px;font-weight:560;font-size:14px;border-radius:0}
.topnav button:hover{color:var(--bar-ink)}
.topnav button[aria-current="page"]{color:var(--action);border-bottom-color:var(--action)}
.iconbtn{display:inline-grid;place-items:center;width:40px;height:40px;border-radius:8px;border:0;background:none;color:inherit;flex:none}
.iconbtn:hover{background:rgba(127,127,127,.16)}
.navback{margin-left:-6px}
.navback[hidden]{display:none}
.topbar .newbtn{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 12px 0 8px;margin:0 4px;border-radius:6px;border:0;background:var(--action);color:#fff;font-weight:650;font-size:14px}
.topbar .newbtn svg{width:18px;height:18px;stroke-width:2.2}
.search{display:none;position:absolute;top:51px;left:-1px;right:-1px;padding:8px 10px 10px;background:var(--bar);border:1px solid var(--bar-line);border-top:0;border-radius:0 0 12px 12px}
body.searching .search{display:block}
.search-field{position:relative}
.search-field svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);width:17px;height:17px;color:var(--bar-ink-2);pointer-events:none}
.search input{width:100%;height:38px;border-radius:6px;border:1px solid transparent;background:var(--bar-field);color:var(--ink);padding:0 10px 0 34px;font-size:16px}
.search input::placeholder{color:var(--bar-ink-2)}
.search input:focus{outline:none;border-color:var(--action)}
.results{position:absolute;left:10px;right:10px;top:54px;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:8px;box-shadow:var(--shadow-overlay);max-height:min(70vh,520px);overflow:auto;padding:6px}
.results h3{font-size:12px;font-weight:600;color:var(--ink-3);padding:8px 10px 4px;font-stretch:90%}
.results button{display:flex;flex-direction:column;align-items:flex-start;width:100%;text-align:left;background:none;border:0;border-radius:6px;padding:8px 10px}
.results button:hover,.results button:focus-visible{background:var(--action-soft)}
.results .r-sub{font-size:13px;color:var(--ink-3)}
.results .none{padding:14px 10px;color:var(--ink-3)}

/* ===== mobile tab bar ===== */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.tabbar button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 2px 7px;background:none;border:0;border-top:2px solid transparent;color:var(--ink-3);font-size:11.5px;font-weight:560;font-stretch:92%;border-radius:0}
.tabbar button[aria-current="page"]{color:var(--action);border-top-color:var(--action)}
.tabbar svg.ic{width:22px;height:22px}

/* ===== view frame ===== */
.view{max-width:1280px;margin:0 auto;padding:16px 12px 96px}
.vh{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px;margin:2px 2px 14px}
.vh h1{font-size:26px;line-height:1.1;font-weight:740;font-stretch:112%;letter-spacing:-.01em}
.vh-sub{color:var(--ink-3);font-size:14px;margin-top:3px}
.vh-actions{display:flex;flex-wrap:wrap;gap:8px;flex:0 1 auto;max-width:100%}
.banner{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px;padding:10px 12px;margin-bottom:12px;border:1px solid var(--line);background:var(--surface-2);border-radius:8px;font-size:14px}
.banner.is-warn{border-color:var(--warn);background:var(--warn-soft)}
.banner p{flex:1 1 240px}
.banner.meld-new{border-color:var(--action);background:var(--action-soft)}
.banner.meld-new .btn{max-width:100%;overflow:hidden;text-overflow:ellipsis}

/* ===== buttons ===== */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:38px;padding:0 14px;border-radius:6px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-weight:600;font-size:14px;white-space:nowrap}
.btn:hover{border-color:var(--ink-3)}
.btn svg.ic{width:17px;height:17px}
.btn.primary{background:var(--action);border-color:var(--action);color:var(--action-ink)}
.btn.primary:hover{background:var(--action-hover);border-color:var(--action-hover)}
.btn.danger{color:var(--danger);border-color:var(--danger)}
.btn.small{height:32px;padding:0 10px;font-size:13px}
.btn[disabled]{opacity:.5;cursor:default}
.btn[aria-pressed="true"]{background:var(--nav);border-color:var(--nav);color:#fff}
.link{background:none;border:0;padding:0;color:var(--action);font-weight:600;font-size:13.5px}
.link:hover{text-decoration:underline}
.link.danger{color:var(--danger)}

/* ===== panels ===== */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:8px;min-width:0}
.ph{display:flex;align-items:baseline;justify-content:space-between;gap:10px;padding:13px 14px 0}
.ph h2{font-size:15px;font-weight:680;font-stretch:104%}
.pb{padding:10px 14px 14px}
.cols{display:grid;gap:12px;margin-top:12px;align-items:start}
.stack{display:contents}
.empty{padding:18px 14px 20px;color:var(--ink-3);font-size:14px;max-width:60ch}
.empty strong{display:block;color:var(--ink);font-weight:650;margin-bottom:2px}
.empty .btn{margin-top:10px}

/* ===== goal ===== */
.goal{padding:14px}
.goal-top{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:4px 16px}
.goal-fig{font-size:28px;font-weight:720;font-stretch:96%;letter-spacing:-.01em;line-height:1.1}
.goal-fig span{font-size:15px;font-weight:500;color:var(--ink-3);letter-spacing:0}
.goal-when{font-size:14px;color:var(--ink-2)}
.track{position:relative;height:18px;margin:28px 0 6px;border-radius:3px;background:var(--surface-3);border:1px solid var(--line)}
.track-proj{position:absolute;inset:0 auto 0 0;border-radius:2px;background:repeating-linear-gradient(135deg,var(--brass-line) 0 4px,transparent 4px 8px)}
.track-now{position:absolute;inset:0 auto 0 0;border-radius:2px;background:var(--brass)}
.track-pace{position:absolute;top:-6px;bottom:-6px;width:2px;margin-left:-1px;background:var(--ink)}
.track-pace::after{content:"pace";position:absolute;top:-16px;left:50%;transform:translateX(-50%);font-size:11px;font-weight:600;color:var(--ink-2);font-stretch:88%}
.track-ends{display:flex;justify-content:space-between;font-size:12.5px;color:var(--ink-3)}
.goal-note{margin-top:10px;font-size:14px;color:var(--ink-2);max-width:72ch}
.legend{display:inline-flex;align-items:center;gap:5px;margin-right:12px;white-space:nowrap}
.legend i{display:inline-block;width:12px;height:10px;border-radius:2px;background:var(--brass)}
.legend i.hatch{background:repeating-linear-gradient(135deg,var(--brass-line) 0 3px,transparent 3px 6px);border:1px solid var(--brass-line)}

/* ===== kpi strip ===== */
.kpis{display:grid;grid-template-columns:1fr 1fr;margin-top:12px}
.kpi{padding:12px 14px;border-top:1px solid var(--line-2);border-left:1px solid var(--line-2)}
.kpi:nth-child(-n+2){border-top:0}
.kpi:nth-child(odd){border-left:0}
.kpi-l{font-size:13px;color:var(--ink-2);font-stretch:92%}
.kpi-v{font-size:22px;font-weight:700;font-stretch:96%;line-height:1.2;margin-top:1px}
.kpi-s{font-size:12.5px;color:var(--ink-3)}

/* ===== exchange clock (signature) ===== */
.clock{--tone:var(--ink-2)}
.clock.tone-warn{--tone:var(--warn)}
.clock.tone-danger{--tone:var(--danger)}
.clock.tone-ok{--tone:var(--ok)}
.clock-head{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:2px 10px;font-size:13.5px}
.clock-day{font-weight:700;font-size:15px}
.clock-of{font-weight:500;color:var(--ink-3);font-size:13px}
.clock-next{color:var(--tone);font-weight:620}
.ruler{position:relative;height:16px;margin-top:6px;border:1px solid var(--line);border-radius:2px;background:var(--surface-2);overflow:hidden}
.ruler-idzone{position:absolute;inset:0 75% 0 0;background:var(--brass-soft);border-right:2px solid var(--brass)}
.ruler-idzone.done{background:var(--ok-soft);border-right-color:var(--ok)}
.ruler-fill{position:absolute;left:0;bottom:0;height:5px;background:var(--tone)}
.ruler-ticks{position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 calc(100%/12 - 1px),var(--line) calc(100%/12 - 1px) calc(100%/12));opacity:.9}
.ruler-now{position:absolute;top:0;bottom:0;width:2px;margin-left:-1px;background:var(--ink)}
.ruler-scale{position:relative;display:flex;justify-content:space-between;height:17px;margin-top:3px;font-size:11.5px;color:var(--ink-3);font-stretch:88%}
.ruler-scale .at45{position:absolute;left:25%;padding-left:3px;color:var(--brass);font-weight:600}
.ruler-scale .at45.done{color:var(--ok)}
.clock-note{margin-top:8px;font-size:13px;color:var(--warn);background:var(--warn-soft);border-radius:5px;padding:7px 9px}
body.first-paint .ruler-fill,body.first-paint .track-now{animation:grow .7s cubic-bezier(.2,.7,.2,1) both}
@keyframes grow{from{width:0}}
.clockrow{display:block;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--line-2);padding:12px 14px;border-radius:0}
.clockrow:first-child{border-top:0}
.clockrow:hover{background:var(--surface-2)}
.clockrow-top{display:flex;justify-content:space-between;gap:10px;margin-bottom:6px;font-weight:620}
.clockrow-top span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ===== generic rows ===== */
.rows > *{border-top:1px solid var(--line-2)}
.rows > *:first-child{border-top:0}
.rowbtn{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:0;border-radius:0;padding:10px 14px;min-height:48px}
.rowbtn:hover{background:var(--surface-2)}
.row-main{flex:1;min-width:0}
.row-t{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row-s{font-size:13px;color:var(--ink-3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row-r{flex:none;text-align:right;font-size:13px;color:var(--ink-2)}
.row-r strong{display:block;font-size:14.5px;color:var(--ink);font-weight:650}
.avatar{display:grid;place-items:center;flex:none;width:36px;height:36px;border-radius:50%;background:var(--surface-3);color:var(--ink-2);font-weight:680;font-size:13px;font-stretch:90%}
.avatar.sq{border-radius:8px}
.avatar.lg{width:52px;height:52px;font-size:18px}

/* ===== pills ===== */
.pill{display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 9px;border-radius:999px;background:var(--surface-3);color:var(--ink-2);font-size:12.5px;font-weight:600;font-stretch:92%;white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.danger{background:var(--danger-soft);color:var(--danger)}
.pill.action{background:var(--action-soft);color:var(--action)}
.pill.brass{background:var(--brass-soft);color:var(--brass)}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--c,var(--ink-3));flex:none}

/* ===== toolbar ===== */
.tools{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.tools input[type="search"],.tools select{height:38px;border:1px solid var(--line);border-radius:6px;background:var(--surface);padding:0 10px;font-size:16px;min-width:0}
.tools input[type="search"]{flex:1 1 180px}
.tools select{flex:1 1 130px;max-width:100%}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;background:var(--surface);overflow:hidden;flex:none}
.seg button{height:36px;padding:0 12px;border:0;border-left:1px solid var(--line);background:none;font-weight:600;font-size:13.5px;color:var(--ink-2);border-radius:0}
.seg button:first-child{border-left:0}
.seg button[aria-pressed="true"]{background:var(--nav);color:#fff}

/* ===== grid tables (people, firms, exchanges) ===== */
.gt{overflow:hidden}
.gt-head{display:none}
.gt-row{display:grid;grid-template-columns:36px 1fr auto;grid-template-areas:"av name r1" "av sub r2";column-gap:10px;align-items:center;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--line-2);border-radius:0;padding:10px 14px}
.gt-row:hover{background:var(--surface-2)}
.gt-row .avatar{grid-area:av}
.c-name{grid-area:name;font-weight:620;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.c-sub{grid-area:sub;font-size:13px;color:var(--ink-3);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.c-r1{grid-area:r1;justify-self:end;font-size:13px;color:var(--ink-2);white-space:nowrap}
.c-r2{grid-area:r2;justify-self:end;display:flex;gap:4px}
.c-x{display:none}
.gt-row.noav{grid-template-columns:1fr auto;grid-template-areas:"name r1" "sub r2"}
.gt-foot{padding:10px 14px;border-top:1px solid var(--line-2);font-size:13px;color:var(--ink-3)}
.late{color:var(--danger);font-weight:620}

/* ===== kanban ===== */
.board{display:flex;gap:10px;overflow-x:auto;padding:2px 12px 14px;margin:0 -12px;scroll-snap-type:x proximity;scroll-padding:0 12px;-webkit-overflow-scrolling:touch}
.col{flex:0 0 82%;max-width:320px;scroll-snap-align:start;display:flex;flex-direction:column;background:var(--surface-2);border:1px solid var(--line);border-top:3px solid var(--c);border-radius:8px;min-height:180px}
.col.over{outline:2px dashed var(--action);outline-offset:-4px}
.col-h{padding:10px 12px 8px}
.col-h h2{font-size:14px;font-weight:680;display:flex;justify-content:space-between;gap:8px}
.col-h h2 span{color:var(--ink-3);font-weight:560}
.col-sum{font-size:13px;color:var(--ink-2)}
.col-b{display:flex;flex-direction:column;gap:8px;padding:2px 8px 10px;flex:1}
.card{display:block;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:10px 11px;cursor:pointer}
.card:hover{border-color:var(--ink-3)}
.card.dragging{opacity:.45}
.card-name{font-weight:640;line-height:1.3}
.card-row{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:5px}
.card-amt{font-weight:700;font-size:15.5px}
.card-meta{font-size:13px;color:var(--ink-3);margin-top:3px}
.card .clock{margin-top:8px}
.card .clock-head{font-size:12.5px}
.card .clock-day{font-size:13px}
.card .ruler{height:12px}
.col-empty{padding:12px 6px;font-size:13px;color:var(--ink-3)}

/* ===== tasks ===== */
.quick{display:flex;flex-wrap:wrap;gap:8px;padding:12px 14px;border-bottom:1px solid var(--line-2)}
.quick input{height:38px;border:1px solid var(--line);border-radius:6px;background:var(--surface);padding:0 10px;font-size:16px;min-width:0}
.quick input[type="text"]{flex:1 1 200px}
.quick input[type="date"]{flex:0 1 150px}
.tgroup h2{font-size:13px;font-weight:650;color:var(--ink-2);padding:12px 14px 4px;display:flex;justify-content:space-between;align-items:baseline}
.tgroup h2.late{color:var(--danger)}
.task{display:flex;align-items:flex-start;gap:4px;padding:2px 8px 2px 4px;border-top:1px solid var(--line-2)}
.tgroup h2 + .task{border-top:0}
.check{display:grid;place-items:center;flex:none;width:44px;height:44px;background:none;border:0}
.check i{display:grid;place-items:center;width:20px;height:20px;border-radius:5px;border:1.8px solid var(--ink-3);background:var(--surface)}
.check i svg{width:14px;height:14px;stroke-width:2.6;opacity:0}
.check[aria-checked="true"] i{background:var(--ok);border-color:var(--ok);color:#fff}
.check[aria-checked="true"] i svg{opacity:1}
.task-main{flex:1;min-width:0;background:none;border:0;text-align:left;padding:10px 4px 10px 0;border-radius:4px}
.task-t{font-weight:500}
.task.done .task-t{text-decoration:line-through;color:var(--ink-3);font-weight:450}
.task-s{font-size:13px;color:var(--ink-3)}
.task-s .late{font-weight:620}

/* ===== reports ===== */
.bars{display:grid;gap:9px;padding:12px 14px 16px}
.bar-row{display:grid;grid-template-columns:92px 1fr auto;gap:4px 10px;align-items:center;font-size:13.5px}
.bar-l{color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar-t{position:relative;height:14px;background:var(--surface-2);border-radius:3px}
.bar-f{position:absolute;inset:0 auto 0 0;min-width:2px;border-radius:3px;background:var(--c,var(--action))}
.bar-v{font-size:13px;font-weight:620;white-space:nowrap;color:var(--ink);min-width:74px;text-align:right}
.weeks{display:flex;align-items:flex-end;gap:6px;height:150px;padding:14px 14px 0}
.week{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:stretch;gap:1px;height:100%;min-width:0}
.week i{display:block;border-radius:2px;background:var(--c)}
.week-n{font-size:11.5px;text-align:center;color:var(--ink-2);font-weight:620;margin-bottom:2px}
.week-labels{display:flex;gap:6px;padding:4px 14px 0;font-size:11px;color:var(--ink-3);font-stretch:85%}
.week-labels span{flex:1;text-align:center;white-space:nowrap;overflow:hidden}
.keys{display:flex;flex-wrap:wrap;gap:4px 14px;padding:10px 14px 14px;font-size:12.5px;color:var(--ink-2)}
.keys span{display:inline-flex;align-items:center;gap:5px}
.stat-pair{display:grid;grid-template-columns:1fr 1fr}
.stat-pair .kpi:nth-child(-n+2){border-top:0}

/* ===== drawer (record page) ===== */
.scrim{position:fixed;inset:0;z-index:40;background:rgba(6,16,26,.5)}
.drawer{position:fixed;inset:0 0 0 auto;z-index:41;width:min(620px,100%);display:flex;flex-direction:column;padding-top:calc(env(safe-area-inset-top,0px) + 8px);background:var(--canvas);box-shadow:var(--shadow-overlay);animation:slidein .2s ease-out}
@keyframes slidein{from{transform:translateX(24px);opacity:0}}
.d-bar{display:flex;align-items:center;gap:2px;height:52px;margin:0 8px;padding:0 6px;background:var(--bar);color:var(--bar-ink);border:1px solid var(--bar-line);border-radius:12px;flex:none}
.d-bar .d-kind{flex:1;font-weight:600;font-size:14px;color:var(--bar-ink-2);padding-left:4px}
.d-body{flex:1;overflow-y:auto;padding:14px 12px calc(28px + env(safe-area-inset-bottom));-webkit-overflow-scrolling:touch}
.d-head{display:flex;gap:12px;align-items:flex-start;margin-bottom:12px}
.d-head h1{font-size:22px;line-height:1.15;font-weight:740;font-stretch:108%;letter-spacing:-.005em}
.d-sub{color:var(--ink-2);font-size:14.5px;margin-top:3px}
.d-chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;align-items:center}
.d-amt{font-size:24px;font-weight:720;font-stretch:96%;margin-top:4px}
.chipsel{height:24px;border-radius:999px;border:1px solid var(--line);background:var(--surface);padding:0 8px;font-size:12.5px;font-weight:600}
.quicklog{display:flex;gap:6px;overflow-x:auto;margin:0 -12px 12px;padding:2px 12px;scrollbar-width:none}
.quicklog::-webkit-scrollbar{display:none}
.quicklog .btn{flex:none}
.d-sec{margin-top:12px}
.path{display:flex;overflow-x:auto;margin:0 -12px 12px;padding:0 12px 2px;scrollbar-width:none}
.path::-webkit-scrollbar{display:none}
.path-step{flex:1 0 auto;min-width:88px;height:36px;border:0;border-radius:0;margin-left:-7px;padding:0 16px 0 22px;background:var(--surface-3);color:var(--ink-2);font-weight:620;font-size:13px;font-stretch:94%;clip-path:polygon(0 0,calc(100% - 12px) 0,100% 50%,calc(100% - 12px) 100%,0 100%,12px 50%)}
.path-step:first-child{margin-left:0;padding-left:14px;clip-path:polygon(0 0,calc(100% - 12px) 0,100% 50%,calc(100% - 12px) 100%,0 100%)}
.path-step.done{background:var(--ok-soft);color:var(--ok)}
.path-step.current{background:var(--nav);color:#fff}
.path.is-lost .path-step{background:var(--surface-3);color:var(--ink-3)}
.path-step:focus-visible{outline:none;text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:3px}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:0}
.field{padding:9px 14px;border-top:1px solid var(--line-2);min-width:0}
.field:nth-child(-n+2){border-top:0}
.field.wide{grid-column:1/-1}
.field.wide:first-child + .field{border-top:1px solid var(--line-2)}
.field dt{font-size:12.5px;color:var(--ink-3);font-stretch:92%}
.field dd{margin:1px 0 0;overflow-wrap:anywhere}
.field dd.pre{white-space:pre-wrap}
.tl{padding:4px 0 6px}
.tl-item{display:flex;gap:10px;padding:10px 8px 10px 14px;border-top:1px solid var(--line-2)}
.tl-item:first-child{border-top:0}
.tl-ic{display:grid;place-items:center;flex:none;width:30px;height:30px;border-radius:50%;background:var(--surface-3);color:var(--ink-2)}
.tl-ic svg.ic{width:16px;height:16px}
.tl-ic.t-call{background:var(--ok-soft);color:var(--ok)}
.tl-ic.t-email{background:var(--action-soft);color:var(--action)}
.tl-ic.t-meeting,.tl-ic.t-event{background:var(--brass-soft);color:var(--brass)}
.tl-body{flex:1;min-width:0}
.tl-top{font-size:13px;color:var(--ink-3)}
.tl-top strong{color:var(--ink-2);font-weight:650}
.tl-subj{font-weight:500;color:var(--ink);overflow-wrap:anywhere}
.tl-notes{font-size:14px;color:var(--ink-2);white-space:pre-wrap;overflow-wrap:anywhere;margin-top:2px}
.tl-item .iconbtn{width:36px;height:36px;color:var(--ink-3)}
.tl-item .iconbtn svg.ic{width:16px;height:16px}

/* ===== modal + forms ===== */
.modal-wrap{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-end;justify-content:center;padding-top:calc(env(safe-area-inset-top,0px) + 12px);background:rgba(6,16,26,.55)}
.modal{display:flex;flex-direction:column;width:100%;max-width:580px;max-height:100%;background:var(--surface);border-radius:14px 14px 0 0;box-shadow:var(--shadow-overlay);animation:sheetup .2s ease-out}
@keyframes sheetup{from{transform:translateY(20px);opacity:0}}
.m-head{display:flex;align-items:center;justify-content:space-between;gap:4px;padding:8px 8px 8px 16px;border-bottom:1px solid var(--line-2);flex:none}
.m-head h2{flex:1;min-width:0;font-size:17px;font-weight:720;font-stretch:106%}
.m-head .m-back{margin-left:-10px}
.m-body{padding:14px 16px 6px;overflow-y:auto;-webkit-overflow-scrolling:touch}
.m-foot{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:8px;padding:12px 16px calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--line-2);flex:none}
.m-foot .spacer{flex:1}
.f-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px 10px}
.f{grid-column:1/-1;min-width:0}
.f.half{grid-column:auto}
.f label,.f .lab{display:block;font-size:13px;font-weight:600;color:var(--ink-2);margin-bottom:4px}
.f input[type="text"],.f input[type="email"],.f input[type="tel"],.f input[type="url"],.f input[type="date"],.f select,.f textarea{display:block;width:100%;min-height:42px;border:1px solid var(--line);border-radius:5px;background:var(--surface);padding:8px 10px;font-size:16px}
.f textarea{min-height:84px;resize:vertical;line-height:1.4}
.f input:focus,.f select:focus,.f textarea:focus{outline:2px solid var(--action);outline-offset:-1px;border-color:var(--action)}
.f .hint{font-size:12.5px;color:var(--ink-3);margin-top:4px}
.f.bad input,.f.bad textarea,.f.bad select,.f.bad .picker-in{border-color:var(--danger)}
.f .err{display:none;font-size:12.5px;color:var(--danger);margin-top:4px;font-weight:600}
.f.bad .err{display:block}
.f-check{display:flex;align-items:center;gap:8px;min-height:42px}
.f-check input{width:20px;height:20px;accent-color:var(--action)}
.f-sep{grid-column:1/-1;border-top:1px solid var(--line-2);padding-top:12px;font-weight:650;font-size:14px}
.segpick{display:flex;flex-wrap:wrap;gap:6px}
.segpick button{display:inline-flex;align-items:center;gap:6px;height:38px;padding:0 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:14px;color:var(--ink-2)}
.segpick button svg.ic{width:16px;height:16px}
.segpick button[aria-pressed="true"]{background:var(--nav);border-color:var(--nav);color:#fff}
.picker{position:relative}
.picker-list{position:absolute;z-index:5;left:0;right:0;top:calc(100% + 4px);background:var(--surface);border:1px solid var(--line);border-radius:6px;box-shadow:var(--shadow-overlay);max-height:240px;overflow:auto;padding:4px}
.picker-list button{display:block;width:100%;text-align:left;background:none;border:0;border-radius:4px;padding:8px 9px;font-size:15px}
.picker-list button:hover,.picker-list button.hot{background:var(--action-soft)}
.picker-list small{display:block;color:var(--ink-3);font-size:12.5px}
.picker-list .add{color:var(--action);font-weight:600}
.progress{height:8px;border-radius:4px;background:var(--surface-3);overflow:hidden;margin-top:10px}
.progress i{display:block;height:100%;background:var(--action);width:0;transition:width .2s}
.note-box{background:var(--surface-2);border:1px solid var(--line-2);border-radius:6px;padding:10px 12px;font-size:14px;color:var(--ink-2)}
.note-box.late{background:var(--danger-soft);border-color:transparent;color:var(--danger);font-weight:560}
.f input[type="file"]{display:block;width:100%;padding:8px 0}
.set-list{display:grid;gap:8px}
.set-list .btn{justify-content:flex-start}
.modal{position:relative}
.ic-panel{position:absolute;inset:0;z-index:3;display:flex;flex-direction:column;background:var(--surface);border-radius:inherit}
.ic-panel[hidden]{display:none}
.ic-body{flex:1;overflow-y:auto;padding:14px 16px 18px;-webkit-overflow-scrolling:touch}
.ic-body input[type="search"]{display:block;width:100%;height:42px;border:1px solid var(--line);border-radius:6px;background:var(--surface);padding:0 10px;font-size:16px}
.ic-body .rowbtn{padding:10px 4px}
.ic-body > p.row-s{white-space:normal;overflow:visible;overflow-wrap:break-word}
.card-top{display:flex;gap:12px;align-items:flex-start;margin-bottom:14px}
.card-top img{flex:none;width:132px;max-height:96px;object-fit:cover;border:1px solid var(--line);border-radius:6px;background:var(--surface-2)}
.card-side{flex:1;min-width:0}
.card-side .row-s{white-space:normal;overflow:visible}
.card-notes{margin:6px 0 0;padding-left:18px;font-size:14px;color:var(--warn)}
.card-btns{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;margin-top:10px}
.calc-out{margin-top:18px;padding-top:14px;border-top:1px solid var(--line-2)}
.calc-h{font-weight:650;margin:14px 0 6px;color:var(--ink)}
.calc-row{display:flex;justify-content:space-between;gap:12px;padding:5px 0;font-size:15px;border-bottom:1px solid var(--line-2)}
.calc-row span:first-child{color:var(--ink-2)}
.calc-row.strong span{font-weight:700;color:var(--ink)}
.calc-sum{margin-top:14px;padding:10px 12px;border-radius:8px;background:var(--surface-2);border:1px solid var(--line-2)}
.calc-sum .calc-row:last-of-type{border-bottom:0}
.calc-out .hint{margin-top:6px}
.role-chips{display:flex;flex-wrap:wrap;gap:6px}
.role-chips .pill{height:26px;font-size:13px}
.role-x{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;margin:0 -6px 0 2px;border:0;border-radius:999px;background:transparent;color:inherit;cursor:pointer}
.role-x .ic{width:14px;height:14px}
.role-x:hover{background:var(--surface-3)}
.role-add{display:flex;gap:8px;margin-top:12px}
.role-add input{flex:1;min-width:0;height:42px;border:1px solid var(--line);border-radius:5px;background:var(--surface);padding:0 10px;font-size:16px}
.role-add input:focus{outline:2px solid var(--action);outline-offset:-1px;border-color:var(--action)}
.meld-text{display:block;width:100%;min-height:220px;border:1px solid var(--line);border-radius:5px;background:var(--surface);padding:8px 10px;font-size:16px;line-height:1.4;resize:vertical}
.meld-text:focus{outline:2px solid var(--action);outline-offset:-1px;border-color:var(--action)}
.meld-top{display:grid;gap:10px;margin-bottom:14px}
.meld-sum ul{margin:6px 0 0;padding-left:18px}
.meld-sum li{margin:4px 0}

/* ===== menus, confirm, toast ===== */
.menu-wrap{position:fixed;inset:0;z-index:45;background:rgba(6,16,26,.4);display:flex;align-items:flex-end}
.menu{width:100%;background:var(--surface);border-radius:14px 14px 0 0;padding:8px 8px calc(10px + env(safe-area-inset-bottom));box-shadow:var(--shadow-overlay);animation:sheetup .18s ease-out}
.menu h2{font-size:13px;font-weight:650;color:var(--ink-3);padding:8px 10px 6px}
.menu button{display:flex;align-items:center;gap:12px;width:100%;min-height:48px;padding:0 10px;background:none;border:0;border-radius:8px;font-weight:580;font-size:15.5px;text-align:left}
.menu button:hover{background:var(--surface-2)}
.menu button svg.ic{color:var(--ink-2)}
.confirm-wrap{position:fixed;inset:0;z-index:60;display:grid;place-items:center;padding:calc(env(safe-area-inset-top,0px) + 20px) 20px 20px;background:rgba(6,16,26,.55)}
.confirm{width:100%;max-width:400px;background:var(--surface);border-radius:12px;padding:18px;box-shadow:var(--shadow-overlay)}
.confirm h2{font-size:17px;font-weight:720}
.confirm p{margin-top:6px;color:var(--ink-2);font-size:14.5px}
.confirm-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}
.confirm p.gate-note{margin-top:12px;font-size:13px;color:var(--ink-3)}
.gate .set-list .btn{width:100%}
a.btn,a.btn:hover{text-decoration:none}
.btn.danger-solid{background:var(--danger);border-color:var(--danger);color:#fff}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:70;max-width:min(92vw,460px);background:var(--ink);color:var(--canvas);padding:10px 14px;border-radius:8px;font-size:14px;font-weight:560;box-shadow:var(--shadow-overlay);animation:sheetup .18s ease-out}
.toast.is-warn{background:var(--danger);color:#fff}
body:has(.org-bar) .toast{bottom:auto;top:calc(env(safe-area-inset-top,0px) + 72px)}
.loading{padding:60px 20px;text-align:center;color:var(--ink-3)}

/* ===== weekly sales goals: the weekly sheet (brick header row, pink goal and total columns), a pace chart, an 8-week trend ===== */
.wk-nav{align-items:center}
.wk-arrow{width:38px;height:38px;border:1px solid var(--line);border-radius:6px;background:var(--surface)}
.wk-arrow:hover{border-color:var(--ink-3);background:var(--surface)}
.wk-save{font-size:12.5px}
.ws-row{display:grid;grid-template-columns:repeat(5,minmax(0,1fr)) minmax(0,1.3fr);column-gap:6px;padding:0 12px 12px;border-top:1px solid var(--line-2)}
.ws-head{margin-top:10px;padding:8px 12px;border-top:0;background:var(--action);color:var(--action-ink);font-size:12.5px;font-weight:650;text-align:center;line-height:1.2}
.ws-head .ws-l{display:none}
.ws-d small{display:block;margin-top:1px;font-size:11px;font-weight:500;opacity:.9}
.ws-d.is-today small{font-weight:700;opacity:1}
.ws-l{grid-column:1/-1;display:flex;justify-content:space-between;align-items:baseline;gap:8px;padding:10px 0 6px;font-size:14.5px;font-weight:640;line-height:1.25}
.ws-l small{font-size:12.5px;font-weight:500;color:var(--ink-3);white-space:nowrap}
.ws-c{min-width:0}
.ws-in{display:block;width:100%;min-width:0;height:44px;padding:0;border:1px solid var(--line);border-radius:5px;background:var(--surface);color:var(--ink);text-align:center;font-size:17px;font-weight:620;font-variant-numeric:tabular-nums}
.ws-in.is-today{border-color:var(--action)}
.ws-in:focus{outline:2px solid var(--action);outline-offset:-1px;border-color:var(--action)}
.ws-in:disabled{background:var(--surface-2);color:var(--ink-2)}
.ws-tot{display:flex;flex-direction:column;align-items:center;justify-content:center;height:44px;border-radius:5px;background:var(--action-soft);line-height:1.1}
.ws-tot strong{font-size:18px;font-weight:720;color:var(--ink)}
.ws-tot span{font-size:11px;color:var(--ink-2)}
.ws-tot.met{background:var(--ok-soft)}
.ws-tot.met strong,.ws-tot.met span{color:var(--ok)}
.ws-foot{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:12px;border-top:1px solid var(--line-2)}
.ws-foot .hint{flex:1 1 100%;max-width:72ch;font-size:12.5px;color:var(--ink-3)}
.recap{display:grid;gap:12px;padding:10px 14px 14px}
.recap .pre{margin-top:2px;white-space:pre-wrap;color:var(--ink)}
.pace-sum{padding:8px 14px 0;font-size:14px;color:var(--ink-2)}
.pace{display:grid;grid-template-columns:minmax(0,1fr) auto;column-gap:10px;align-items:center;padding:4px 14px 8px}
.pace-row{display:contents}
.pace-l{min-width:0;padding-top:10px;font-size:14px;font-weight:600;line-height:1.25}
.pace-v{display:flex;align-items:center;justify-content:flex-end;gap:6px;padding-top:10px;font-size:13px;color:var(--ink-2);white-space:nowrap}
.pace-v strong{font-size:15px;font-weight:700;color:var(--ink)}
.pace-t{grid-column:1/-1;position:relative;height:14px;margin-top:7px;border:1px solid var(--line-2);border-radius:3px;background:var(--surface-2)}
.pace-band{position:absolute;top:0;bottom:0;background:var(--brass-soft)}
.pace-fill{position:absolute;left:0;top:2px;bottom:2px;border-radius:0 4px 4px 0;background:var(--action)}
.pace-goal{position:absolute;top:-4px;bottom:-4px;width:2px;margin-left:-1px;border-radius:1px;background:var(--ink-2)}

.tr-goal{position:absolute;left:0;right:0;height:0;border-top:1.5px dashed var(--ink-2);pointer-events:none}
.tr-axis{display:flex;justify-content:space-between;margin-left:122px;font-size:11.5px;color:var(--ink-3)}
.wk-tip{position:absolute;z-index:5;padding:6px 9px;border-radius:6px;background:var(--ink);color:var(--canvas);font-size:12.5px;font-weight:560;white-space:nowrap;pointer-events:none;box-shadow:var(--shadow-overlay)}
@media (min-width:640px){
  .ws-row{grid-template-columns:minmax(150px,1.8fr) repeat(5,minmax(0,1fr)) minmax(0,1.2fr);column-gap:0;align-items:stretch;padding:0}
  .ws-row > *{padding:8px 4px}
  .ws-row > :last-child{padding-right:12px}
  .ws-row > .ws-l{grid-column:auto;flex-direction:column;justify-content:center;align-items:flex-start;gap:2px;padding:8px 12px;background:var(--action-soft);font-size:14px}
  .ws-head{padding:0}
  .ws-head > *{padding:9px 4px}

  .pace{grid-template-columns:minmax(110px,150px) minmax(0,1fr) max-content;grid-auto-flow:row dense;row-gap:14px;padding-top:12px}
  .pace-l,.pace-v{padding-top:0}
  .pace-l{grid-column:1}
  .pace-v{grid-column:3}
  .pace-t{grid-column:2;margin-top:0}
}

(() => {
'use strict';
/* ================= constants ================= */
const STAGES = [
  {id:'lead',       name:'Lead',       prob:.10, color:'var(--s-lead)'},
  {id:'qualified',  name:'Qualified',  prob:.30, color:'var(--s-qualified)'},
  {id:'docs',       name:'Docs out',   prob:.60, color:'var(--s-docs)'},
  {id:'funded',     name:'Funded',     prob:1,   color:'var(--s-funded)'},
  {id:'identified', name:'Identified', prob:1,   color:'var(--s-identified)'},
  {id:'completed',  name:'Completed',  prob:1,   color:'var(--s-completed)'},
  {id:'lost',       name:'Lost',       prob:0,   color:'var(--s-lost)'},
];
const STAGE = Object.fromEntries(STAGES.map((s, i) => [s.id, {...s, i}]));
const PRE = ['lead', 'qualified', 'docs'];
const HELD = ['funded', 'identified'];
const BASE_ROLES = ['Attorney', 'CPA', 'Commercial broker', 'Residential broker', 'Wealth advisor', 'Title / escrow', 'Lender', 'Investor', 'Past RE client', 'Friends & family', 'Other', 'Uncategorized'];
const NO_ROLE = 'Uncategorized';   // where people with no role, or an unknown one, are counted
/* the user's own roles (Settings > Roles, kept in meta/settings.roles) go after the built-in ones, before Other and Uncategorized.
   ROLES is rebuilt whenever settings change (syncRoles); everything that lists roles reads it at render time. */
let ROLES = BASE_ROLES.slice();
const ROLE_MAX = 40, ROLES_MAX = 30;
function customRoles(list){
  const out = [], seen = new Set(BASE_ROLES.map(r => r.toLowerCase()));
  for (const x of Array.isArray(list) ? list : []){
    const r = String(x ?? '').replace(/\s+/g, ' ').trim().slice(0, ROLE_MAX);
    if (r && !seen.has(r.toLowerCase()) && out.length < ROLES_MAX){ seen.add(r.toLowerCase()); out.push(r); }
  }
  return out;
}
const roleOf = p => ROLES.includes(p.role) ? p.role : NO_ROLE;
const RELS = [
  {id:'new', name:'New'}, {id:'introduced', name:'Introduced'}, {id:'warm', name:'Warm'},
  {id:'referring', name:'Referring'}, {id:'champion', name:'Champion'},
];
const REL = Object.fromEntries(RELS.map((r, i) => [r.id, {...r, i}]));
const TIERS = [{id:'A', name:'A tier'}, {id:'B', name:'B tier'}, {id:'C', name:'C tier'}];   // person.tier is 'A' | 'B' | 'C'; blank or missing = no tier
const TIER = Object.fromEntries(TIERS.map((t, i) => [t.id, {...t, i}]));
const TIER_OPTS = [...TIERS, {id:'', name:'No tier'}];
const FIRM_TYPES = ['Law firm', 'CPA firm', 'Commercial brokerage', 'Residential brokerage', 'Wealth management', 'Title / escrow', 'Bank / lender', 'Investor / owner', 'Other'];
const ACT_TYPES = [
  {id:'call', name:'Call', icon:'phone'}, {id:'email', name:'Email', icon:'mail'},
  {id:'meeting', name:'Meeting', icon:'cal'}, {id:'event', name:'Event', icon:'star'},
  {id:'note', name:'Note', icon:'note'},
];
const ACT = Object.fromEntries(ACT_TYPES.map(a => [a.id, a]));
const EX_TYPES = ['Forward', 'Reverse', 'Improvement', 'Simultaneous'];
const LOST_REASONS = ['Sale fell through', 'Went with another intermediary', 'Decided to pay the tax', 'No replacement property found', 'Did not qualify', 'Other'];
const CADENCES = [{id:0, name:'No schedule'}, {id:14, name:'Every 2 weeks'}, {id:30, name:'Every 30 days'}, {id:60, name:'Every 60 days'}, {id:90, name:'Every 90 days'}, {id:180, name:'Every 6 months'}];
const MONTHS = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
const WEEKDAYS = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
const MAX_PER_COLLECTION = 1000;   // exchanges and tasks: one document each
const MAX_DOCS = 4800;
const BUCKET_MAX = 450;
/* people and firms are packed into hashed bucket documents, so the store's per-query document limit never caps the list */
const SHARDS = {people:128, firms:32};
const MAX_ROWS = {people:10000, firms:5000};

/* ================= state ================= */
const S = {
  mode:'loading',            // loading | db | memory | lost
  canWrite:true, writeKnown:false, wroteOk:false,
  people:new Map(), firms:new Map(), exchanges:new Map(), tasks:new Map(), intakes:new Map(), weeks:new Map(), docs:new Map(),
  buckets:new Map(), serverBuckets:new Set(), shardDocs:new Set(),
  pending:{people:new Map(), firms:new Map(), exchanges:new Map(), tasks:new Map(), intakes:new Map(), weeks:new Map(), docs:new Map()},   // local writes not yet confirmed, kept on top of every snapshot
  settings:{},
  loaded:{people:false, firms:false, exchanges:false, tasks:false, intakes:false, weeks:false, docs:false, activities:false, settings:false, meld:false},
  tab:'home',
  role:'sales',               // sales | coord: which profile this person uses
  detail:null, stack:[],
  f:{
    people:{q:'', role:'', rel:'', tier:'', sort:'name', auto:true},   // auto: next time People opens, start on Uncategorized

      const rest = {...(cur && cur.items || {})}; for (const id of ids) delete rest[id];
      if (Object.keys(rest).length) await ref.set({items:rest});
      else { await ref.delete(); S.serverBuckets.delete(key); }
    }));
    S.wroteOk = true;
  } catch (e){ writeFailed(e); throw e; }
}

/* many activities at once (a bulk email logged to everyone it went to): one write per month bucket */
async function saveActivities(acts){
  if (!guardWrite()) throw {code:'blocked'};
  const local = new Map([...S.buckets].map(([k, b]) => [k, Object.keys(b.items || {}).length]));
  const groups = new Map();
  for (const a of acts){
    const body = prune(a); delete body.id;
    const base = body.date.slice(0, 7); let key = base;
    for (let n = 1; n < 40; n++){ key = n === 1 ? base : `${base}-${n}`; if ((local.get(key) || 0) < BUCKET_MAX) break; }
    local.set(key, (local.get(key) || 0) + 1);
    const g = groups.get(key) || {}; g[a.id] = body; groups.set(key, g);
  }
  for (const [key, g] of groups){ const cur = S.buckets.get(key); S.buckets.set(key, {items:{...(cur && cur.items || {}), ...g}}); }
  changed();
  if (S.mode !== 'db') return;
  try {
    for (const [key, g] of groups){
      await enqueue(`activities/${key}`, () => withRetry(async () => {
        const ref = DB.doc(`activities/${key}`);
        if (S.serverBuckets.has(key)){
          try { await ref.update({items:g}); return; }
          catch (e){ if (!e || e.code !== 'invalid_argument') throw e; }
        }
        const cur = S.buckets.get(key);
        await ref.set({items:{...(cur && cur.items || {})}});
        S.serverBuckets.add(key);
      }));
    }
    S.wroteOk = true;
  } catch (e){ writeFailed(e); throw e; }
}

function snapToMap(snap){ const m = new Map(); for (const d of snap.docs){ const v = d.data(); if (v && typeof v === 'object') m.set(d.id, v); } return m; }
function subscribe(){
  const subColl = (name, tries = 0) => {
    DB.collection(name).limit(MAX_PER_COLLECTION).onSnapshot(snap => {
      RS()[name] = overlay(name, snapToMap(snap)); S.loaded[name] = true; changed();
      if (name === 'intakes') setTimeout(meldInboxRun, 0);
    }, e => subFailed(e, () => subColl(name, tries + 1), tries));
  };
  ['exchanges', 'tasks', 'intakes', 'weeks', 'docs'].forEach(n => subColl(n));
  const subShard = (name, tries = 0) => {
    DB.collection(name).limit(MAX_PER_COLLECTION).onSnapshot(snap => {
      const m = new Map(), legacy = [], sd = RS().shardDocs;
      for (const p of [...sd]) if (p.startsWith(name + '/')) sd.delete(p);
      for (const d of snap.docs){
        const v = d.data() || {};
        if (v.items && typeof v.items === 'object'){
          for (const [id, r] of Object.entries(v.items)) if (r && typeof r === 'object') m.set(id, r);
          if (!d.metadata || !d.metadata.hasPendingWrites) sd.add(`${name}/${d.id}`);
        } else if (Object.keys(v).length){ m.set(d.id, v); legacy.push(d.id); }   // saved one-per-document by an earlier version
      }
      RS()[name] = overlay(name, m); S.loaded[name] = true; changed();
      if (legacy.length) migrateLegacy(name, legacy);
    }, e => subFailed(e, () => subShard(name, tries + 1), tries));
  };
  ['people', 'firms'].forEach(n => subShard(n));
  const subActs = (tries = 0) => {
    DB.collection('activities').limit(MAX_PER_COLLECTION).onSnapshot(snap => {
      const m = new Map(), seen = new Set();
      for (const d of snap.docs){ const v = d.data() || {}; m.set(d.id, {items:(v.items && typeof v.items === 'object') ? v.items : {}}); if (!d.metadata || !d.metadata.hasPendingWrites) seen.add(d.id); }
      const st = RS(); st.buckets = m; st.serverBuckets = seen; S.loaded.activities = true; changed();
    }, e => subFailed(e, () => subActs(tries + 1), tries));
  };
  subActs();
  const subSettings = (tries = 0) => {
    DB.doc('meta/settings').onSnapshot(snap => {
      RS().settings = snap.exists ? (snap.data() || {}) : {}; S.loaded.settings = true; syncRoles(); changed();
    }, e => subFailed(e, () => subSettings(tries + 1), tries));
  };
  subSettings();
  const subMeld = (tries = 0) => {
    DB.doc('meta/meld').onSnapshot(snap => {
      const v = snap.exists ? (snap.data() || {}) : {};
      MI.seen = {...(v.seen && typeof v.seen === 'object' ? v.seen : {}), ...MI.seen}; S.loaded.meld = true; changed();
      setTimeout(meldInboxRun, 0);
    }, e => subFailed(e, () => subMeld(tries + 1), tries));
  };
  subMeld();
}
const migrating = new Set();
async function migrateLegacy(coll, ids){
  if (S.mode !== 'db' || !S.canWrite) return;
  const todo = ids.filter(id => !migrating.has(id)); if (!todo.length) return;
  todo.forEach(id => migrating.add(id));
  try {
    for (const id of todo){
      const r = S[coll].get(id); if (!r) continue;
      await writeShard(coll, shardOf(coll, id), {[id]:r});
      await enqueue(`${coll}/${id}`, () => withRetry(() => DB.doc(`${coll}/${id}`).delete()));
    }
  } catch {}
}
function subFailed(e, again, tries){
  const code = e && e.code;
  if (code === 'unavailable' && tries < 3) { setTimeout(again, 1500 * (tries + 1)); return; }
  const st = RS();   // the real records lose their connection, even while the demo is on screen
  if (st.mode === 'db') { st.mode = 'lost'; Object.keys(S.loaded).forEach(k => S.loaded[k] = true); changed(); }
}
const allLoaded = () => Object.values(S.loaded).every(Boolean);

/* ================= derived indexes ================= */
function push(map, key, val){ if (!key) return; const a = map.get(key); if (a) a.push(val); else map.set(key, [val]); }
function reindex(){
  syncRoles();   // people snapshots can bring a role settings no longer lists
  const t = today();
  const acts = [];
  for (const [key, b] of S.buckets) for (const [id, a] of Object.entries(b.items || {})) if (a && typeof a === 'object' && isDate(a.date)) acts.push({...a, id, _bucket:key});
  acts.sort((a, b) => b.date.localeCompare(a.date) || (b.createdAt || 0) - (a.createdAt || 0));
  I.acts = acts;
  I.lastTouch = new Map(); I.byPerson = new Map(); I.byFirm = new Map(); I.byExchange = new Map();
  for (const a of acts){
    push(I.byPerson, a.personId, a); push(I.byExchange, a.exchangeId, a);
    const fid = a.firmId || (a.personId && (S.people.get(a.personId) || {}).firmId);
    push(I.byFirm, fid, a);
    if (a.type !== 'note' && a.personId && a.date <= t && !I.lastTouch.has(a.personId)) I.lastTouch.set(a.personId, a.date);
  }
  I.peopleByFirm = new Map();
  for (const [id, p] of S.people) push(I.peopleByFirm, p.firmId, {...p, id});
  I.xByReferrer = new Map();
  for (const [id, x] of S.exchanges) push(I.xByReferrer, x.referrerId, {...x, id});
  I.tasksOpen = [...S.tasks].map(([id, k]) => ({...k, id})).filter(k => !k.done)
    .sort((a, b) => (isDate(a.due) ? a.due : '9999').localeCompare(isDate(b.due) ? b.due : '9999') || (b.high ? 1 : 0) - (a.high ? 1 : 0) || (a.createdAt || 0) - (b.createdAt || 0));
}

function touchInfo(p, id){
  const last = I.lastTouch.get(id) || '';
  const cadence = +p.cadence || 0;
  const t = today();
  const since = last ? daysBetween(last, t) : null;
  let overdue = 0, nextDue = '';
  if (cadence > 0){
    const anchor = last || (p.createdAt ? fromDayNum(Math.floor(p.createdAt / 864e5)) : t);
    nextDue = addDays(anchor, cadence);
    overdue = Math.max(0, daysBetween(nextDue, t));
  }
  return {last, since, cadence, nextDue, overdue};
}

function clockOf(x){
  if (!isDate(x.relinquishedClosed) || !HELD.concat('completed').includes(x.stage)) return null;
  const start = x.relinquishedClosed, t = today();
  const idDue = addDays(start, 45), exDue = addDays(start, 180);
  const day = clamp(daysBetween(start, t), 0, 9999);
  const idLeft = daysBetween(t, idDue), exLeft = daysBetween(t, exDue);
  const identified = x.stage !== 'funded';
  const done = x.stage === 'completed';
  let tone = 'normal', next;
  if (done){ tone = 'ok'; next = isDate(x.completedOn) ? `Completed ${fmtDate(x.completedOn)}` : 'Completed'; }
  else if (!identified){
    if (idLeft < 0){ tone = 'danger'; next = `Identification deadline passed ${fmtDate(idDue)}`; }
    else { tone = idLeft <= 7 ? 'danger' : idLeft <= 21 ? 'warn' : 'normal'; next = idLeft === 0 ? 'Identification due today' : `Identify by ${fmtDate(idDue)}, ${plural(idLeft, 'day')} left`; }
  } else {
    if (exLeft < 0){ tone = 'danger'; next = `Exchange period ended ${fmtDate(exDue)}`; }
    else { tone = exLeft <= 14 ? 'danger' : exLeft <= 45 ? 'warn' : 'normal'; next = exLeft === 0 ? 'Must close today' : `Close by ${fmtDate(exDue)}, ${plural(exLeft, 'day')} left`; }
  }
  const apr15 = `${+start.slice(0, 4) + 1}-04-15`;
  const needsExtension = !done && exDue > apr15;
  const urgency = done ? 9999 : identified ? exLeft : idLeft;
  return {start, idDue, exDue, day:Math.min(day, 180), pct:clamp(day / 180 * 100, 0, 100), idLeft, exLeft, identified, done, tone, next, needsExtension, apr15, urgency};
}

function metrics(){
  const xs = [...S.exchanges].map(([id, x]) => ({...x, id}));
  const pre = xs.filter(x => PRE.includes(x.stage));
  const held = xs.filter(x => HELD.includes(x.stage));
  const q = quarterOf(today());
  const feesQ = xs.filter(x => x.stage !== 'lost' && isDate(x.relinquishedClosed) && x.relinquishedClosed >= q.start && x.relinquishedClosed <= q.end);
  return {
    xs, pre, held, q,
    pipeline:sum(pre, x => x.proceeds),
    weighted:sum(pre, x => (+x.proceeds || 0) * STAGE[x.stage].prob),
    onDeposit:sum(held, x => x.proceeds),
    feesQ:sum(feesQ, x => x.fee), feesQn:feesQ.length,
  };
}

function goalPanel(m){

  const t = today();
  const span = target - base;
  const byDate = isDate(g.goalDate) ? g.goalDate : '';
  const landing = sum(m.pre.filter(x => !byDate || (isDate(x.expectedClose) && x.expectedClose <= byDate)), x => (+x.proceeds || 0) * STAGE[x.stage].prob);
  const pNow = clamp((cur - base) / span * 100, 0, 100);
  const pProj = clamp((cur + landing - base) / span * 100, 0, 100);
  let pace = '';
  if (byDate && isDate(g.goalStart) && byDate > g.goalStart){

  const note = gap === 0 ? 'Goal reached.'

/* ================= Meld inbox =================
   Meld's Send to Basis button emails the same JSON block to the user's Gmail (subject "Send to Basis..."). While Basis is open it
   reads Gmail through his claude.ai Gmail connector (read only: search_threads, get_thread) and saves each new block as an
   intake marked "From Meld, check it" (review:true, meld:{msg, rid, from, at, checks}). Each Gmail message is taken once: its id
   goes in meta/meld.seen, so deleting the intake does not bring it back, and the intake id comes from the message id, so two
   open devices write the same record. People are only linked on an exact name match; nobody is created. */
const MI = {mcp:null, stop:null, busy:false, again:false, threads:null, next:'', seen:{}, note:''};

   account's owner). A Send to Basis email from any other address is skipped and named in a note, so a change of address is not silent. */
const MELD_FROM = 'onboarding@resend.dev';
const MELD_Q = 'subject:"Send to Basis" newer_than:60d';
const mailAddr = s => (/<([^<>]+)>/.exec(String(s || '')) || [, String(s || '')])[1].trim().toLowerCase();

const meldAsks = m => m && m.id && !MI.seen[m.id] && /send to basis/i.test(String(m.subject || '')) && !/^\s*(re|fwd?|fw)\s*:/i.test(String(m.subject || ''));

const mcpPayload = res => { const p = res && res.payload; if (typeof p !== 'string') return p; try { return JSON.parse(p); } catch { return null; } };
/* what to tell the user when Gmail cannot be read; '' for a passing hiccup the next check retries */
function meldInboxProblem(e){
  const c = e && e.code;
  if (c === 'needs_reauth') return 'Gmail needs to be reconnected in claude.ai Settings > Connectors before Send to Basis emails can come in.';
  if (c === 'server_not_connected' || c === 'server_not_found') return 'Add the Gmail connector in claude.ai Settings > Connectors so Send to Basis emails can come in.';
  if (c === 'selection_required') return 'Claude has more than one Gmail connected. Choose one when Basis asks, so Send to Basis emails can come in.';
  if (c === 'not_in_manifest') return 'Gmail is turned off for Basis, so Send to Basis emails are not coming in. Allow it when Basis asks.';
  if (c === 'blocked_by_policy' || c === 'approval_required') return 'Your Claude organization blocks Basis from reading Gmail, so Send to Basis emails are not coming in.';
  if (c === 'not_granted' || c === 'capability_disabled' || c === 'capability_removed') return 'Send to Basis emails cannot be checked in this view.';
  if (c === 'server_unavailable' || c === 'upstream_error' || c === 'rate_limited' || c === 'cancelled') return '';
  if (c === 'tool_error') return 'Gmail reported a problem: ' + String(e.message || '').slice(0, 160);
  return 'Could not check Gmail for Send to Basis emails.';
}
function meldNote(text){ if (MI.note !== text){ MI.note = text; changed(); } }
function meldInboxStart(){
  if (!MI.mcp || MI.stop) return;
  MI.stop = MI.mcp.watchTool('Gmail', 'search_threads', {query:MELD_Q, pageSize:20, view:'THREAD_VIEW_MINIMAL'}, ev => {
    if (ev.type === 'error'){ const t = meldInboxProblem(ev.error); if (t || ev.error.code === 'cancelled') meldNote(t); return; }
    const p = mcpPayload(ev.result);
    MI.threads = p && Array.isArray(p.threads) ? p.threads : []; MI.next = p && typeof p.nextPageToken === 'string' ? p.nextPageToken : '';
    const other = MI.threads.flatMap(t => Array.isArray(t.messages) ? t.messages : []).find(m => meldAsks(m) && !meldMine(m));
    meldNote(other ? `Basis skipped a Send to Basis email from ${mailAddr(other.sender) || 'an unknown sender'}, because Meld sends from ${MELD_FROM}. If Meld now sends from that address, Basis needs to be updated to accept it.` : '');

/* the plain-text body of one message from get_thread; any string holding the block will do if the field is named differently */

  if (typeof direct === 'string' && direct.includes('basisIntake')) return direct;

/* new Send to Basis messages, read and saved one thread at a time, oldest first, stopping at the first one that fails so
   everything not yet taken stays newer than everything taken (the next check finds it by paging back to taken mail) */
async function meldInboxRun(){
  if (MI.busy){ MI.again = true; return; }
  if (!MI.mcp || !MI.threads || S.mode !== 'db' || !S.canWrite || !S.loaded.intakes || !S.loaded.meld) return;
  if (!MI.threads.some(t => meldFresh(t).length)) return;
  MI.busy = true;
  try {
    /* Gmail lists newest first, a page at a time: until a page reaches mail already taken, older new mail can be on the next one */
    const taken = pg => pg.some(t => (Array.isArray(t.messages) ? t.messages : []).some(m => m && MI.seen[m.id]));
    let page = MI.threads, token = MI.next; const all = [...page];

      try { p = mcpPayload(await MI.mcp.callTool('Gmail', 'search_threads', {query:MELD_Q, pageSize:50, pageToken:token, view:'THREAD_VIEW_MINIMAL'}, {cache:false})); }
      catch (e){ const msg = meldInboxProblem(e); if (msg) meldNote(msg); return; }
      page = p && Array.isArray(p.threads) ? p.threads : []; token = p && typeof p.nextPageToken === 'string' ? p.nextPageToken : ''; all.push(...page);
    }
    const todo = all.map(t => ({id:String(t.id || ''), msgs:meldFresh(t)})).filter(t => t.id && t.msgs.length).reverse();
    for (const t of todo){
      let p;
      try { p = mcpPayload(await MI.mcp.callTool('Gmail', 'get_thread', {threadId:t.id, messageFormat:'PLAIN_TEXT'}, {cache:false})); }
      catch (e){ const msg = meldInboxProblem(e); if (msg) meldNote(msg); return; }   // left unseen: the next check tries again from here
      const full = new Map((p && Array.isArray(p.messages) ? p.messages : []).map(m => [String(m.id), m]));
      const done = [];

      for (const m of t.msgs){
        const fm = full.get(String(m.id)); if (!fm) continue;
        const data = meldParse(meldBody(fm));
        if (!data){ toast('A Send to Basis email could not be read. Check it in Gmail.', true); done.push(m.id); continue; }
        try { await meldImport(data, {...m, ...fm}); done.push(m.id); }
        catch (e){
          const c = e && e.code;
          if ((c === 'invalid_argument' || c === 'transform_error') && S.canWrite) done.push(m.id);   // this one can never be saved: take it once (writeFailed said so) rather than every minute
          else { stop = true; break; }   // blocked, storage full, offline: the next check tries again from here
        }

async function meldImport(data, m){
  const rid = meldStr(data.recordingId).slice(0, 160);
  const id = 'i_m' + String(m.id).replace(/[^A-Za-z0-9_-]/g, '').slice(0, 60);
  const dupe = map => map.has(id) || !!rid && [...map.values()].some(r => r && r.meld && r.meld.rid === rid);
  if (dupe(S.intakes)){ toast('That recording is already in Basis.'); return; }
  /* this view can lag behind another device (first snapshot pages from cache, the periodic refresh after a gap, a phone back from
     the background while its Gmail check runs at once), so ask the store before writing: never overwrite an intake the user may have
     corrected, bring back one he deleted, or save a re-send twice */

  const sv = seen.exists ? (seen.data() || {}).seen : null;
  if (sv && typeof sv === 'object' && sv[m.id] || dupe(snapToMap(list))) return;   // taken on another device
  const r = meldMerge({}, data, 1);
  if (!r){ toast('A Send to Basis email had nothing for the intake form.', true); return; }
  const rec = formToIntake(r.v, r.n), now = Date.now();
  let idCut = 0;   // the same check Save does: no box is stored holding an ID number
  for (const k of ['exName', 'partners', 'lookingFor', 'repNotes', 'notes']) if (idNumberIn(rec[k])){ rec[k] = ''; idCut++; }
  for (const p of rec.rel) for (const k of ['address', 'timing', 'closer', 'closerContact']) if (idNumberIn(p[k])){ p[k] = ''; idCut++; }
  if (idCut) r.checks.push({text:`Left out ${idCut} ${idCut === 1 ? 'box' : 'boxes'} that looked like an SSN, tax ID, birth date or account number. Enter those in EMP.`});
  const at = +m.internalDate || Date.parse(m.date) || now;

  /* a record the db would refuse (over 256 KiB) is never sent: it would fail every minute and could read as view-only access */
  if (new TextEncoder().encode(JSON.stringify(doc)).length > 240000){ toast('A Send to Basis email was too long to keep. Enter that intake by hand.', true); return; }

}
/* remember messages already taken, merged into meta/meld so two devices do not undo each other */
async function meldSeen(ids){
  const now = Date.now(), patch = {};
  for (const id of ids) patch[id] = now;
  MI.seen = {...MI.seen, ...patch};
  let all = MI.seen;
  const keys = Object.keys(all);
  if (keys.length > MELD_SEEN_MAX) all = Object.fromEntries(keys.sort((a, b) => all[b] - all[a]).slice(0, MELD_SEEN_MAX).map(k => [k, MI.seen[k]]));
  const ref = DB.doc('meta/meld'), whole = all !== MI.seen;
  try {
    await enqueue('meta/meld', () => withRetry(async () => {
      if (whole) return ref.set({seen:all});
      try { await ref.update({seen:patch}); }
      catch (e){ if (!e || e.code !== 'invalid_argument') throw e; await ref.set({seen:MI.seen}); }   // the first one: the doc does not exist yet
    }));
  } catch {}   // not remembered: the intake ids still stop a second copy
}

    556,556,500,556,556,278,556,556,222,222,500,222,833,556,556,556,556,333,500,278,556,500,722,500,500,500,334,260,334,584];

    [`Net investment income tax${A.loss ? ` (${A.R.niit ? '3.8%' : '0%'} of ${usd(A.net)})` : ''}`, usd(A.niit)], [`State${A.loss ? ` (${pctTxt(A.R.state)} of ${usd(A.net)})` : ''}`, usd(A.state)], ['Total tax', usd(A.tax)]]});
  if (A.ok.length) secs.push({sec:'With a 1031 exchange', rows:[['Tax deferred', usd(A.tax)], ['Cash from the sale to reinvest', usd(A.cash)],
    ...(A.short ? [['Cash due at closing (loan payoff above the net sale)', usd(A.short)]] : []), ['Cash left after tax on a sale', usd(A.equity - A.tax)]]});
  const assume = [`Federal capital gains rate ${pctTxt(A.R.fed)}; depreciation recapture ${pctTxt(A.R.recap)}; net investment income tax ${A.R.niit ? '3.8%' : 'not included'}; state ${pctTxt(A.R.state)}.`,
    'The property was held for more than a year, so the gain is long-term.'];
  if (A.loss) assume.push('Gains and losses are netted as if all the properties are sold in the same year. Exchanging a property sold at a loss would defer the loss too.');
  A.res.forEach((x, i) => {
    if (x.missing || x.notHeld) return;
    const where = many ? `${addr(i)}: ` : '';
    if (x.life) assume.push(`${where}depreciated as ${x.life === 39 ? 'commercial' : 'residential rental'} property over ${x.life} years${x.land ? `, with ${usd(x.land)} of the price as land` : ', with no land value given'}.`);
    if (x.how === 'estimated') assume.push(`${where}depreciation is estimated from the year bought${x.capped ? ' and is capped at the full schedule' : ''}; the actual figure on the tax returns will differ.`);
    if (x.how === 'none' && x.life) assume.push(`${where}no depreciation was included, so the tax may be understated.`);
    if (x.zeroDep) assume.push(`${where}no depreciation was taken. The basis is still reduced by the depreciation allowable, even if none was claimed, so the tax may be higher.`);
  });
  const skipped = A.res.map((x, i) => x.notHeld ? `${addr(i)}: not held for investment or business use, so it does not qualify for a 1031 exchange.` : '').filter(Boolean);
  const tail = [], cap1 = t => t.charAt(0).toUpperCase() + t.slice(1);
  assume.forEach((t, i) => { assume[i] = cap1(t); });
  if (A.tax > 0) tail.push({head:'To defer all of the tax', items:[`Buy replacement property worth at least ${usd(A.target.netSale)}.`,
    ...(A.target.cash > 0 ? [`Reinvest all ${usd(A.target.cash)} of the cash from the sale.`] : []), ...(A.target.debt ? [`Replace the ${usd(A.target.debt)} loan payoff with new financing or added cash.`] : [])]});
  if (skipped.length) tail.push({head:'Not included in this estimate', items:skipped});
  tail.push({head:'Assumptions', items:assume});
  tail.push({para:'This is a rough estimate for discussion only, based on the figures above. It is not tax, legal or investment advice. Your actual tax depends on your full tax situation, including your income, other gains and losses, and the depreciation allowed or allowable on the property. Please review it with your CPA or tax attorney before you decide anything.'});
  const lead = !A.ok.length ? [] : A.tax > 0 ? [{text:`Estimated tax deferred: ${usd(A.tax)}`, size:14}] : [{text:A.net > 0 ? 'At the rates used there is no tax to defer.' : 'The estimate shows no gain, so there is no tax to defer.', size:13}];
  return {title:'Estimated tax deferred with a 1031 exchange', subs:[`Prepared for ${name} on ${fmtDate(today(), true)}.`, ...(A.ok.length && skipped.length ? [`Covers ${A.ok.length} of ${A.res.length} properties; see Not included in this estimate.`] : [])],
    lead, secs, tail, brand:true, A};
}
function calcText(o){
  const out = ['BASIS', o.title.toUpperCase(), ...o.subs, ...(o.lead || []).map(l => l.text), ''];
  for (const sec of o.secs){ out.push(sec.sec.toUpperCase()); for (const [l, v] of sec.rows) out.push(`${l}: ${v}`); out.push(''); }
  for (const t of o.tail){ if (t.head) out.push(t.head.toUpperCase()); if (t.items) out.push(...t.items.map(x => `- ${x}`)); if (t.para) out.push(t.para); out.push(''); }

}

/* ================= long lists: first chunk now, the rest over the next frames ================= */
let PROG = null;
const PROG_CHUNK = 250;
function progStart(list, rowFn){
  PROG = {token:(PROG ? PROG.token : 0) + 1, list, rowFn, next:Math.min(list.length, PROG_CHUNK)};
  return list.slice(0, PROG.next).map((o, i) => rowFn(o, i)).join('') + (list.length > PROG.next ? `<p class="gt-foot prog-tail" aria-live="polite">Loading ${(list.length - PROG.next).toLocaleString('en-US')} more</p>` : '');
}
function progContinue(){
  const st = PROG; if (!st || st.next >= st.list.length) return;
  const token = st.token;
  const step = () => {
    if (!PROG || PROG.token !== token) return;
    const tail = $('.prog-tail'); if (!tail) return;
    const end = Math.min(st.list.length, st.next + PROG_CHUNK);
    tail.insertAdjacentHTML('beforebegin', st.list.slice(st.next, end).map((o, k) => st.rowFn(o, st.next + k)).join(''));
    st.next = end;
    if (st.next < st.list.length){ tail.textContent = `Loading ${(st.list.length - st.next).toLocaleString('en-US')} more`; requestAnimationFrame(step); }
    else tail.remove();
  };
  requestAnimationFrame(step);
}

const ORG_GROUPS = [['role', 'Role'], ['rel', 'Relationship'], ['tier', 'Tier'], ['domain', 'Email'], ['firm', 'Firm']];
const emailDomain = p => { const e = (p.email || '').toLowerCase(), i = e.indexOf('@'); return i > 0 ? e.slice(i + 1) : ''; };
function orgKeyOf(p, group){
  if (group === 'role') return roleOf(p);
  if (group === 'rel') return p.rel || 'new';
  if (group === 'tier') return TIER[p.tier] ? p.tier : 'none';
  if (group === 'domain') return emailDomain(p) || '(none)';
  return p.firmId && S.firms.has(p.firmId) ? p.firmId : '(none)';
}
function orgList(){
  const f = S.f.org, q = f.q.trim().toLowerCase();
  if (!ORG_GROUPS.some(g => g[0] === f.group)) f.group = 'role';
  const counts = new Map();
  for (const p of S.people.values()){ const k = orgKeyOf(p, f.group); counts.set(k, (counts.get(k) || 0) + 1); }
  let secs;

/* ================= weekly sales goals =================
   The weekly sales sheet: five goals counted Monday to Friday, a weekly total for each, and a recap (wins, challenges,
   priorities for next week). One document per week at weeks/<that Monday's date>: {days:{<goal id>:[Mon..Fri, a whole number
   or null]}, wins, challenges, priorities, goals:{<goal id>:{min, max}}, createdAt, updatedAt}. Each week keeps the goals it was
   filled in against, so changing a goal later never rewrites past weeks. Typing updates the page at once and saves shortly after
   (WK.t holds the pending saves, flushed when the page is hidden). The current goals and the name printed on the sheet live in
   meta/settings (weekGoals, weekName). */
const WEEK_GOALS = [
  {id:'calls', name:'Calls', short:'Calls', min:20, max:20},
  {id:'meetings', name:'In-person meeting or Zoom', short:'Meetings or Zoom', min:3, max:5},
  {id:'presentations', name:'Education presentations', short:'Presentations', min:2, max:3},
  {id:'contacts', name:'New contacts', short:'New contacts', min:25, max:25},
  {id:'deals', name:'Deals entered', short:'Deals entered', min:5, max:5},

function fmtWeek(wid){
  const f = addDays(wid, 4), [y1, m1, d1] = wid.split('-').map(Number), [y2, m2, d2] = f.split('-').map(Number);
  if (y1 !== y2) return `${MONTHS[m1 - 1]} ${d1}, ${y1} to ${MONTHS[m2 - 1]} ${d2}, ${y2}`;
  return `${MONTHS[m1 - 1]} ${d1} to ${m1 === m2 ? '' : MONTHS[m2 - 1] + ' '}${d2}, ${y2}`;

function goalsNorm(src){

    const max = Number.isInteger(x.max) && x.max >= min && x.max <= 999 ? x.max : Math.max(min, g.max);

}
const weekGoalsOf = w => goalsNorm(w && w.goals ? w.goals : S.settings.weekGoals);
/* each goal's total for the week, or null when none of its five boxes has a number */
function weekTotals(w){
  const o = {};
  for (const g of WEEK_GOALS){
    const a = DAY3.map((_, i) => cellAt(w, g.id, i)).filter(v => v !== null);
    o[g.id] = a.length ? a.reduce((s, v) => s + v, 0) : null;

}
/* where each goal stands. Pace is an even share of the goal for every weekday through today (this week only); a range goal

function weekState(wid){
  const w = S.weeks.get(wid) || null, G = weekGoalsOf(w), tot = weekTotals(w), t = today(), thisMon = mondayOf(t);
  const phase = wid < thisMon ? 'past' : wid > thisMon ? 'future' : 'now', di = dowMon(t);
  const upTo = phase === 'past' ? 5 : phase === 'future' ? 0 : Math.min(5, di + 1);
  const over = phase === 'past' || (phase === 'now' && di >= 5);
  const rows = WEEK_GOALS.map(g => {
    const goal = G[g.id], n = tot[g.id] || 0, pace = goal.min * upTo / 5, need = Math.max(0, Math.ceil(pace - n - 1e-9));
    const behind = n < goal.min * Math.max(0, upTo - 1) / 5 - 1e-9;

function weekText(wid){

  for (const r of s.rows) out.push(`${r.g.name} (goal ${goalText(r.goal)}): ${r.n} for the week. ${DAY3.map((d, i) => { const v = cellAt(s.w, r.g.id, i); return `${d} ${v === null ? '-' : v}`; }).join(', ')}`);
  for (const [k, l] of WEEK_NOTES) out.push('', l.toUpperCase(), String(s.w && s.w[k] || '').trim() || '-');
  return out.join('\n');
}
/* the sheet as a PDF laid out like the paper form: title, name and date, the goal grid, then the recap (a long recap runs onto
   a second page). Text-only Helvetica like the other Basis PDFs, so every number can be selected and copied. */
function weekPDF(wid){
  const s = weekState(wid), w = s.w, PW = 612, PH = 792, M = 54;
  const RED = DEMO ? '0.114 0.373 0.655' : '0.624 0.176 0.125', PINK = DEMO ? '0.890 0.929 0.973' : '0.973 0.902 0.890', INK = '0.13 0.13 0.13', GRAY = '0.42 0.46 0.49', WHITE = '1 1 1';
  const win = v => Array.from(String(v ?? '').normalize('NFC').replace(/\t/g, ' ').replace(/\p{Zs}/gu, ' ').replace(/[‐-‒―−]/g, '-').replace(/\p{Cf}/gu, '').replace(/[\x00-\x1F\x7F-\x9F]/g, ''), ch => {
    const n = ch.codePointAt(0);
    if (n >= 0x20 && n <= 0xFF) return ch;
    if (WINANSI[ch]) return WINANSI[ch];
    if (NO_NFD[ch]) return NO_NFD[ch];
    const bare = ch.normalize('NFD').replace(/\p{M}/gu, '');
    return bare.length === 1 && bare.codePointAt(0) <= 0xFF ? bare : '?';
  }).join('');
  const pstr = t => '(' + t.replace(/\\/g, '\\\\').replace(/\(/g, '\\(').replace(/\)/g, '\\)') + ')';
  const wd = (t, size, bold) => Array.from(t).reduce((a, c) => a + HELV(c), 0) * size / 1000 * (bold ? 1.08 : 1);
  const wrap = (v, size, maxW, bold) => {
    const out = [], f = size / 1000 * (bold ? 1.08 : 1);
    for (const para of String(v ?? '').replace(/\r\n?/g, '\n').split('\n')){
      let ln = '';
      for (const word of win(para).split(' ')){
        const t = ln ? ln + ' ' + word : word;
        if (wd(t, size, bold) <= maxW){ ln = t; continue; }
        if (ln) out.push(ln);
        ln = word;
        while (wd(ln, size, bold) > maxW){ let k = 0, u = 0; while (k < ln.length && (u + HELV(ln[k])) * f <= maxW) u += HELV(ln[k++]); k = Math.max(1, k); out.push(ln.slice(0, k)); ln = ln.slice(k); }
      }
      out.push(ln);
    }
    return out;
  };
  const pages = []; let ops = [], y = PH - M;
  const text = (x, yy, size, bold, t, rgb = INK) => ops.push(`BT /${bold ? 'F2' : 'F1'} ${size} Tf ${rgb} rg ${x.toFixed(1)} ${yy.toFixed(1)} Td ${pstr(t)} Tj ET`);
  const mid = (a, b, yy, size, bold, t, rgb) => text(a + (b - a - wd(t, size, bold)) / 2, yy, size, bold, t, rgb);
  const box = (x, yy, bw, bh, rgb) => ops.push(`${rgb} rg ${x.toFixed(1)} ${yy.toFixed(1)} ${bw.toFixed(1)} ${bh.toFixed(1)} re f`);
  const rule = (x1, y1, x2, y2) => ops.push(`${x1.toFixed(1)} ${y1.toFixed(1)} m ${x2.toFixed(1)} ${y2.toFixed(1)} l S`);
  const [fy, fm, fd] = addDays(wid, 4).split('-');
  text(M, y - 22, 22, true, 'WEEKLY SALES GOALS', RED); y -= 40;
  text(M, y - 12, 12, false, win(weekName()));
  const dt = `Date: ${+fm}/${+fd}/${fy.slice(2)}`;
  text(PW - M - wd(dt, 12, false), y - 12, 12, false, dt);
  y -= 30;
  const LW = 168, CW = (PW - 2 * M - LW) / 6, HH = 34, xs = [M, M + LW];
  for (let i = 1; i <= 6; i++) xs.push(M + LW + CW * i);
  const top = y;
  box(M, y - HH, PW - 2 * M, HH, RED);
  mid(xs[0], xs[1], y - 21, 10.5, true, 'Sales Goal', WHITE);
  WEEKDAYS.slice(1, 6).forEach((d, i) => mid(xs[i + 1], xs[i + 2], y - 21, 9.5, true, d, WHITE));
  mid(xs[6], xs[7], y - 15, 9.5, true, 'Weekly', WHITE); mid(xs[6], xs[7], y - 27, 9.5, true, 'Total', WHITE);
  y -= HH;
  const seps = [y];
  for (const r of s.rows){
    const lab = wrap(`${r.g.name} (${goalText(r.goal)})`, 10.5, LW - 14, true), h = Math.max(40, lab.length * 13 + 16);
    box(xs[0], y - h, LW, h, PINK); box(xs[6], y - h, CW, h, PINK);
    lab.forEach((ln, i) => text(xs[0] + 7, y - 17 - i * 13, 10.5, true, ln));
    for (let i = 0; i < 5; i++){ const v = cellAt(w, r.g.id, i); if (v !== null) mid(xs[i + 1], xs[i + 2], y - h / 2 - 4.5, 12.5, false, String(v)); }
    if (r.has) mid(xs[6], xs[7], y - h / 2 - 4.5, 12.5, true, String(r.n));
    y -= h; seps.push(y);
  }
  ops.push('0 0 0 RG 0.75 w');
  ops.push(`${M} ${y.toFixed(1)} ${(PW - 2 * M).toFixed(1)} ${(top - y).toFixed(1)} re S`);
  for (let i = 1; i < 7; i++) rule(xs[i], top, xs[i], y);
  for (const sy of seps.slice(0, -1)) rule(M, sy, PW - M, sy);
  y -= 34;
  text(M, y - 16, 16, false, 'Weekly Summary Recap', RED); y -= 32;
  const need = h => { if (y - h < M + 14){ pages.push(ops.join('\n')); ops = []; y = PH - M; } };
  for (const [k, l] of WEEK_NOTES){
    const body = String(w && w[k] || '').trim(), lines = body ? wrap(body, 10.5, PW - 2 * M, false) : [];
    need(20 + Math.min(lines.length, 2) * 14);
    text(M, y - 12, 11.5, true, `${l}:`); y -= 20;
    for (const ln of lines){ need(14); text(M, y - 11, 10.5, false, ln); y -= 14; }
    y -= lines.length ? 16 : 44;
  }
  text(M, M - 20, 8.5, false, win(`From Basis, ${fmtDate(today(), true)}. Week of ${fmtWeek(wid)}.`), GRAY);
  pages.push(ops.join('\n'));
  return pdfPack(pages);
}
async function weekDownload(wid){
